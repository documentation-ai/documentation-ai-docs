                required:
                  - source
                  - status
                  - media
                properties:
                  source:
                    type: string
                  status:
                    type: string
                    enum:
                      - added
                      - reused
                  media:
                    $ref: '#/components/schemas/MediaObject'
              - type: object
                required:
                  - source
                  - status
                  - error
                  - statusCode
                properties:
                  source:
                    type: string
                  status:
                    type: string
                    enum:
                      - failed
                  error:
                    type: string
                  statusCode:
                    type: integer
    MediaImportRequest:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required:
              - url
            properties:
              url:
                type: string
                format: uri
              name:
                type: string
                minLength: 1
                maxLength: 255
              altText:
                type: string
                maxLength: 1000
    UpdateMediaRequest:
      type: object
      required:
        - altText
      properties:
        altText:
          type: string
          maxLength: 1000
    DeletedMediaResponse:
      type: object
      required:
        - deleted
      properties:
        deleted:
          $ref: '#/components/schemas/MediaObject'
    BulkDeleteMediaRequest:
      type: object
      required:
        - mediaIds
      properties:
        mediaIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
    BulkDeleteMediaResponse:
      type: object
      required:
        - deleted
        - failed
        - reclaimedBytes
      properties:
        deleted:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            required:
              - source
              - error
            properties:
              source:
                type: string
              error:
                type: string
        reclaimedBytes:
          type: integer
          format: int64
    StorageUsage:
      type: object
      required:
        - usedBytes
        - objectCount
        - quotaBytes
        - percentUsed
        - isWarning
        - isOverQuota
        - planType
        - limits
        - enforced
      properties:
        usedBytes:
          type: integer
          format: int64
        objectCount:
