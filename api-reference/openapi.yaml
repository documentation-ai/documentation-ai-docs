          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Bearer authentication using API keys created in the Documentation.AI dashboard.
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Semantic validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RequestEntityTooLarge:
      description: Request entity is too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Unsupported media type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StorageFull:
      description: Storage quota exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Service unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AnalyticsUnavailable:
      description: Analytics provider unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    Branch:
      name: branch
      in: query
      description: Branch name.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Maximum number of results.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Number of results to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    StartDate:
      name: startDate
      in: query
      required: true
      description: Start date in UTC.
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      required: true
      description: End date in UTC.
      schema:
        type: string
        format: date
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      description: Deployment identifier.
      schema:
        type: string
        minLength: 1
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Media file identifier.
      schema:
        type: string
        minLength: 1
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true
    SearchResult:
      type: object
      additionalProperties: true
    Page:
      type: object
      additionalProperties: true
    Branch:
      type: object
      additionalProperties: true
    PullRequest:
      type: object
      additionalProperties: true
    QueuedDeployment:
      type: object
      additionalProperties: true
    Deployment:
      type: object
      additionalProperties: true
    PdfExport:
      type: object
      additionalProperties: true
    TrafficPoint:
      type: object
      required:
        - date
        - pageViews
        - sessions
      properties:
        date:
          type: string
          format: date
        pageViews:
          type: integer
        sessions:
          type: integer
    AnalyticsPage:
      type: object
      additionalProperties: true
    AnalyticsEntry:
      type: object
      additionalProperties: true
    Media:
      type: object
      required:
        - id
        - name
        - url
        - kind
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        kind:
          type: string
          enum:
            - image
            - video
            - audio
            - document
            - data
            - archive
            - font
        altText:
          type: string
        sizeBytes:
          type: integer
        contentType:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pagination:
