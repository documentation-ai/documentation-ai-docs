                  confidenceScore:
                    type: number
                    minimum: 0
                    maximum: 1
                    nullable: true
                  askedAt:
                    type: string
                    format: date-time
            total:
              type: integer
    AiAnswerFeedbackResponse:
      allOf:
        - $ref: '#/components/schemas/DateRange'
        - type: object
          required:
            - entries
            - summary
            - total
          properties:
            entries:
              type: array
              items:
                type: object
                required:
                  - questionId
                  - question
                  - answerSnippet
                  - type
                  - pagePath
                  - sessionId
                  - submittedAt
                properties:
                  questionId:
                    type: string
                  question:
                    type: string
                  answerSnippet:
                    type: string
                  type:
                    type: string
                    enum:
                      - like
                      - dislike
                  pagePath:
                    type: string
                  sessionId:
                    type: string
                  submittedAt:
                    type: string
                    format: date-time
            summary:
              $ref: '#/components/schemas/FeedbackSummary'
            total:
              type: integer
    AiVolumeResponse:
      allOf:
        - $ref: '#/components/schemas/DateRange'
        - type: object
          required:
            - series
          properties:
            series:
              type: array
              items:
                type: object
                required:
                  - date
                  - questions
                  - sessions
                properties:
                  date:
                    type: string
                    format: date
                  questions:
                    type: integer
                  sessions:
                    type: integer
    SearchAnalytics:
      allOf:
        - $ref: '#/components/schemas/DateRange'
        - type: object
          required:
            - totalSearches
            - sessions
            - uniqueQueries
            - noResultSearches
            - noResultRate
            - clickedSearches
            - clickThroughRate
            - aiEscalations
            - aiEscalationRate
          properties:
            totalSearches:
              type: integer
            sessions:
              type: integer
            uniqueQueries:
              type: integer
            noResultSearches:
              type: integer
            noResultRate:
              type: number
              minimum: 0
              maximum: 100
            clickedSearches:
              type: integer
            clickThroughRate:
              type: number
              minimum: 0
              maximum: 100
            aiEscalations:
              type: integer
            aiEscalationRate:
              type: number
              minimum: 0
              maximum: 100
    SearchVolumeResponse:
      allOf:
        - $ref: '#/components/schemas/DateRange'
        - type: object
          required:
            - series
          properties:
            series:
              type: array
              items:
                type: object
                required:
                  - date
                  - searches
                  - sessions
                  - noResultSearches
                properties:
                  date:
                    type: string
                    format: date
                  searches:
                    type: integer
                  sessions:
                    type: integer
                  noResultSearches:
                    type: integer
    SearchQueriesResponse:
      allOf:
        - $ref: '#/components/schemas/DateRange'
        - type: object
          required:
            - queries
            - total
          properties:
            queries:
              type: array
              items:
                type: object
                required:
                  - query
                  - searches
                  - sessions
                  - avgResultsShown
                  - clicks
                  - clickThroughRate
                  - aiEscalations
                  - lastSearchedAt
                properties:
                  query:
                    type: string
                  searches:
                    type: integer
                  sessions:
                    type: integer
                  avgResultsShown:
                    type: number
                  clicks:
                    type: integer
                  clickThroughRate:
                    type: number
                    minimum: 0
                    maximum: 100
                  aiEscalations:
                    type: integer
                  lastSearchedAt:
                    type: string
                    format: date-time
            total:
              type: integer
    SearchResultsResponse:
      allOf:
        - $ref: '#/components/schemas/DateRange'
        - type: object
          required:
            - results
            - total
          properties:
            results:
              type: array
              items:
                type: object
                required:
                  - pagePath
                  - impressions
                  - clicks
                  - clickThroughRate
                properties:
                  pagePath:
                    type: string
                  impressions:
                    type: integer
                  clicks:
                    type: integer
                  clickThroughRate:
                    type: number
                    minimum: 0
                    maximum: 100
            total:
              type: integer
    MediaKind:
      type: string
      enum:
        - image
        - video
        - audio
        - document
        - data
        - archive
        - font
    MediaObject:
      type: object
      required:
        - id
        - name
        - url
        - kind
        - mimeType
        - sizeBytes
        - altText
        - width
        - height
        - durationSeconds
        - pageCount
        - posterUrl
        - createdAt
        - updatedAt
        - snippet
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        kind:
          $ref: '#/components/schemas/MediaKind'
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        altText:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        durationSeconds:
          type: number
          nullable: true
        pageCount:
          type: integer
          nullable: true
        posterUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        snippet:
          type: string
    MediaListResponse:
      type: object
      required:
        - media
        - pagination
      properties:
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaObject'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required:
        - page
        - limit
        - total
        - pages
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer
    SingleMediaResponse:
      type: object
      required:
        - media
      properties:
        media:
          $ref: '#/components/schemas/MediaObject'
    MediaUploadResult:
      type: object
      required:
        - results
      properties:
        results:
          type: array
