        pageTitle:
          type: string
        likes:
          type: integer
        dislikes:
          type: integer
        totalFeedback:
          type: integer
        comments:
          type: integer
        satisfactionRate:
          type: number
          minimum: 0
          maximum: 100
    FeedbackSummary:
      type: object
      required:
        - totalFeedback
        - likes
        - dislikes
        - comments
        - satisfactionRate
      properties:
        totalFeedback:
