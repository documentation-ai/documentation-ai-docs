openapi: "3.0.3"
info:
  title: Documentation.AI Content API
  description: "Programmatic access to read and update your documentation, publish deployments, manage media files, and read analytics.\n\nEach API key is scoped to a single documentation project and carries a role — viewer, editor, or admin — that determines which endpoints it can reach. Because the key identifies the project, no endpoint takes a project identifier.\n\nAll dates are UTC. Timestamps are ISO 8601 strings."
  version: "1.0.0"
  contact:
    name: Documentation.AI Support
    url: https://documentation.ai
servers:
  - url: https://api.documentationai.app/api/v1
    description: Production
security:
  - apiKey: []
tags:
  - name: Configuration
  - name: Pages
  - name: Search
  - name: Branches
  - name: Pull Requests
  - name: Push
  - name: Deployments
  - name: PDF Export
  - name: Analytics
  - name: Media
    description: Upload, list, update, replace, and delete media files
  - name: Storage
    description: Organization storage usage and quota
paths:
  /config:
    get:
      operationId: getConfig
      description: Returns documentation project configuration for a branch.
      tags:
        - Configuration
      parameters:
        - $ref: "#/components/parameters/Branch"
      responses:
        "200":
          description: Project configuration.
          content:
            application/json:
              schema:
                type: object
                required:
                  - branch
                  - config
                properties:
                  branch:
                    type: string
                  config:
                    type: object
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /search:
    get:
      operationId: searchDocumentation
      description: Searches documentation content.
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          description: Search query.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          description: Maximum number of results.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: semanticRatio
          in: query
          description: Ratio of semantic search to lexical search.
          schema:
            type: number
            minimum: 0
            maximum: 1
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pages:
    get:
      operationId: listPages
      description: Lists documentation pages for a branch.
      tags:
        - Pages
      parameters:
        - $ref: "#/components/parameters/Branch"
      responses:
        "200":
          description: Documentation pages.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pages
                  - count
                properties:
                  pages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Page"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pages/{path}:
    get:
      operationId: getPage
      description: Returns a documentation page by path.
      tags:
        - Pages
      parameters:
        - name: path
          in: path
          required: true
          description: Documentation page path.
          schema:
            type: string
            minLength: 1
        - name: branch
          in: query
          description: Branch containing the page.
          schema:
            type: string
      responses:
        "200":
          description: Documentation page.
          content:
            application/json:
              schema:
                type: object
                required:
                  - path
                  - branch
                  - content
                properties:
                  path:
                    type: string
                  branch:
                    type: string
                  content:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /branches:
    get:
      operationId: listBranches
      description: Lists repository branches.
      tags:
        - Branches
      responses:
        "200":
          description: Repository branches.
          content:
            application/json:
              schema:
                type: object
                required:
                  - branches
                properties:
                  branches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBranch
      description: Creates a repository branch.
      tags:
        - Branches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - branchName
              properties:
                branchName:
                  type: string
                sourceBranch:
                  type: string
              additionalProperties: false
      responses:
        "201":
          description: Branch created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - branchName
                  - sourceBranch
                  - sourceSha
                properties:
                  branchName:
                    type: string
                  sourceBranch:
                    type: string
                  sourceSha:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /branches/delete:
    post:
      operationId: deleteBranch
      description: Deletes a repository branch.
      tags:
        - Branches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - branchName
              properties:
                branchName:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: Branch deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /branches/merge:
    post:
      operationId: mergeBranches
      description: Merges one repository branch into another.
      tags:
        - Branches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - base
                - head
              properties:
                base:
                  type: string
                head:
                  type: string
                commitMessage:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: Branches merged.
          content:
            application/json:
              schema:
                type: object
                required:
                  - commitSha
                  - status
                properties:
                  commitSha:
                    type: string
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /pull-requests:
    get:
      operationId: listPullRequests
      description: Lists pull requests.
      tags:
        - Pull Requests
      parameters:
        - name: state
          in: query
          description: Pull request state.
          schema:
            type: string
            enum:
              - open
              - closed
              - all
      responses:
        "200":
          description: Pull requests.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pullRequests
                properties:
                  pullRequests:
                    type: array
                    items:
                      $ref: "#/components/schemas/PullRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /push:
    post:
      operationId: pushFiles
      description: Commits file operations to a branch.
      tags:
        - Push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - commitMessage
                - operations
              properties:
                commitMessage:
                  type: string
                operations:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: true
              additionalProperties: false
      responses:
        "201":
          description: Files pushed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - commitSha
                  - branch
                  - isDeploymentBranch
                  - operationsCompleted
                properties:
                  commitSha:
                    type: string
                  branch:
                    type: string
                  isDeploymentBranch:
                    type: boolean
                  operationsCompleted:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /deploy:
    post:
      operationId: triggerDeployment
      description: Queues a deployment.
      tags:
        - Deployments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                commitSha:
                  type: string
              additionalProperties: false
      responses:
        "202":
          description: Deployment queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedDeployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /deploy/preview:
    post:
      operationId: triggerPreviewDeployment
      description: Queues a preview deployment for a branch.
      tags:
        - Deployments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - branch
              properties:
                branch:
                  type: string
                commitSha:
                  type: string
              additionalProperties: false
      responses:
        "202":
          description: Preview deployment queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/QueuedDeployment"
                  - type: object
                    required:
                      - branch
                    properties:
                      branch:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /deployments:
    get:
      operationId: listDeployments
      description: Lists deployments.
      tags:
        - Deployments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Deployments.
          content:
            application/json:
              schema:
                type: object
                required:
                  - deployments
                  - total
                properties:
                  deployments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Deployment"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /deployments/{deploymentId}:
    get:
      operationId: getDeployment
      description: Returns a deployment by ID.
      tags:
        - Deployments
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "200":
          description: Deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /exports/pdf:
    post:
      operationId: requestPdfExport
      description: Requests a PDF export.
      tags:
        - PDF Export
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
              additionalProperties: false
      responses:
        "200":
          description: PDF export status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfExport"
        "202":
          description: PDF export accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: getPdfExport
      description: Returns the current PDF export status.
      tags:
        - PDF Export
      responses:
        "200":
          description: PDF export status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      description: Returns an analytics overview for a date range.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Analytics overview.
          content:
            application/json:
              schema:
                type: object
                required:
                  - startDate
                  - endDate
                  - pageViews
                  - sessions
                properties:
                  startDate:
                    type: string
                    format: date
                  endDate:
                    type: string
                    format: date
                  pageViews:
                    type: integer
                  sessions:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/traffic:
    get:
      operationId: getAnalyticsTraffic
      description: Returns traffic over time.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Traffic series.
          content:
            application/json:
              schema:
                type: object
                required:
                  - series
                properties:
                  series:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrafficPoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/pages:
    get:
      operationId: getAnalyticsPages
      description: Returns page analytics.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page analytics.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pages
                properties:
                  pages:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/referrers:
    get:
      operationId: getAnalyticsReferrers
      description: Returns traffic referrer analytics.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Referrer analytics.
          content:
            application/json:
              schema:
                type: object
                required:
                  - referrers
                properties:
                  referrers:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/feedback:
    get:
      operationId: getAnalyticsFeedback
      description: Returns page feedback analytics.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: pathContains
          in: query
          description: Filters page paths.
          schema:
            type: string
        - name: sortBy
          in: query
          description: Field used to sort results.
          schema:
            type: string
        - name: sortOrder
          in: query
          description: Sort direction.
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        "200":
          description: Feedback analytics.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pages
                  - summary
                  - total
                properties:
                  pages:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsEntry"
                  summary:
                    type: object
                    additionalProperties: true
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/feedback/comments:
    get:
      operationId: getAnalyticsFeedbackComments
      description: Returns feedback comments for a page.
      tags:
        - Analytics
      parameters:
        - name: pagePath
          in: query
          required: true
          description: Page path.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Feedback comments.
          content:
            application/json:
              schema:
                type: object
                required:
                  - comments
                  - total
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsEntry"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/ai/questions:
    get:
      operationId: getAnalyticsAiQuestions
      description: Returns AI question analytics.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: sessionId
          in: query
          description: Filters by session ID.
          schema:
            type: string
        - name: maxConfidence
          in: query
          description: Maximum confidence threshold.
          schema:
            type: number
            minimum: 0
            maximum: 1
      responses:
        "200":
          description: AI questions.
          content:
            application/json:
              schema:
                type: object
                required:
                  - questions
                  - total
                properties:
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsEntry"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/ai/answer-feedback:
    get:
      operationId: getAnalyticsAiAnswerFeedback
      description: Returns feedback on AI answers.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: AI answer feedback.
          content:
            application/json:
              schema:
                type: object
                required:
                  - entries
                  - summary
                  - total
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsEntry"
                  summary:
                    type: object
                    additionalProperties: true
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/ai/volume:
    get:
      operationId: getAnalyticsAiVolume
      description: Returns AI usage volume over time.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: AI usage volume.
          content:
            application/json:
              schema:
                type: object
                required:
                  - series
                properties:
                  series:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/search:
    get:
      operationId: getAnalyticsSearch
      description: Returns search analytics.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Search analytics.
          content:
            application/json:
              schema:
                type: object
                required:
                  - totalSearches
                  - sessions
                  - noResultRate
                  - clickThroughRate
                properties:
                  totalSearches:
                    type: integer
                  sessions:
                    type: integer
                  noResultRate:
                    type: number
                  clickThroughRate:
                    type: number
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/search/volume:
    get:
      operationId: getAnalyticsSearchVolume
      description: Returns search volume over time.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Search volume.
          content:
            application/json:
              schema:
                type: object
                required:
                  - series
                properties:
                  series:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrafficPoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/search/queries:
    get:
      operationId: getAnalyticsSearchQueries
      description: Returns search query analytics.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: noResultsOnly
          in: query
          description: Restricts results to queries with no results.
          schema:
            type: boolean
      responses:
        "200":
          description: Search queries.
          content:
            application/json:
              schema:
                type: object
                required:
                  - queries
                  - total
                properties:
                  queries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsEntry"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /analytics/search/results:
    get:
      operationId: getAnalyticsSearchResults
      description: Returns pages selected from search results.
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Search result analytics.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pages
                  - total
                properties:
                  pages:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsPage"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/AnalyticsUnavailable"
  /media:
    get:
      operationId: listMedia
      summary: List media files
      description: Returns media files in the media library. Filter by kind or search by name.
      tags:
        - Media
      parameters:
        - name: search
          in: query
          description: Matches file name and alternative text.
          schema:
            type: string
        - name: kind
          in: query
          description: Media kind.
          schema:
            type: string
            enum:
              - image
              - video
              - audio
              - document
              - data
              - archive
              - font
        - name: page
          in: query
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of files per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Media files.
          content:
            application/json:
              schema:
                type: object
                required:
                  - media
                  - pagination
                properties:
                  media:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: uploadMedia
      summary: Upload media files
      description: Uploads one or more files via multipart/form-data. Up to 10 files. Files with the same content hash are returned as reused. Requires editor or admin role.
      tags:
        - Media
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Media upload results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResults"
        "207":
          description: Mixed media upload results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "507":
          $ref: "#/components/responses/StorageFull"
  /media/import:
    post:
      operationId: importMedia
      summary: Import media from URLs
      description: Imports files from public HTTPS URLs. Up to 10 files. Same deduplication and plan-limit rules as upload. Requires editor or admin role.
      tags:
        - Media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required:
                      - url
                    properties:
                      url:
                        type: string
                        minLength: 1
                      name:
                        type: string
                        minLength: 1
                        maxLength: 255
                      altText:
                        type: string
                        maxLength: 1000
                    additionalProperties: false
              additionalProperties: false
      responses:
        "200":
          description: Media import results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResults"
        "207":
          description: Mixed media import results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "507":
          $ref: "#/components/responses/StorageFull"
  /media/bulk-delete:
    post:
      operationId: bulkDeleteMedia
      summary: Delete multiple media files
      description: Deletes up to 100 media files. Individual failures reported in response. Requires admin role.
      tags:
        - Media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mediaIds
              properties:
                mediaIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
              additionalProperties: false
      responses:
        "200":
          description: Bulk deletion results.
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                  - failed
                  - reclaimedBytes
                properties:
                  deleted:
                    type: array
                    items:
                      type: string
                  failed:
                    type: array
                    items:
                      type: object
                      required:
                        - source
                        - error
                      properties:
                        source:
                          type: string
                        error:
                          type: string
                  reclaimedBytes:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /media/{mediaId}:
    get:
      operationId: getMedia
      summary: Get a media file
      description: Returns a single media file by its ID.
      tags:
        - Media
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Media file.
          content:
            application/json:
              schema:
                type: object
                required:
                  - media
                properties:
                  media:
                    $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateMedia
      summary: Update media metadata
      description: Updates the alternative text for a media file. Requires editor or admin role.
      tags:
        - Media
      parameters:
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - altText
              properties:
                altText:
                  type: string
                  maxLength: 1000
              additionalProperties: false
      responses:
        "200":
          description: Updated media file.
          content:
            application/json:
              schema:
                type: object
                required:
                  - media
                properties:
                  media:
                    $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteMedia
      summary: Delete a media file
      description: Permanently deletes a media file. Requires admin role.
      tags:
        - Media
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Deleted media file.
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /media/{mediaId}/replace:
    post:
      operationId: replaceMedia
      summary: Replace a media file
      description: Replaces stored content while keeping ID and URL stable. Accepts multipart or JSON body with URL. Requires editor or admin role.
      tags:
        - Media
      parameters:
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: Replaced media file.
          content:
            application/json:
              schema:
                type: object
                required:
                  - media
                properties:
                  media:
                    $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "507":
          $ref: "#/components/responses/StorageFull"
  /storage:
    get:
      operationId: getStorage
      summary: Get storage usage
      description: Returns the organization storage usage and quota.
      tags:
        - Storage
      responses:
        "200":
          description: Storage usage.
          content:
            application/json:
              schema:
                type: object
                required:
