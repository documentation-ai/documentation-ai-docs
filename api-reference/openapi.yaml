          required:
            - pages
            - summary
            - total
          properties:
            pages:
              type: array
              items:
                $ref: '#/components/schemas/FeedbackPage'
            summary:
              $ref: '#/components/schemas/FeedbackSummary'
            total:
              type: integer
    FeedbackPage:
