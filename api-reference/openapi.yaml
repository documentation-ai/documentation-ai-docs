        quotaBytes:
          type: integer
          format: int64
        percentUsed:
          type: number
          minimum: 0
          maximum: 100
        isWarning:
          type: boolean
        isOverQuota:
          type: boolean
        planType:
          type: string
        limits:
          type: object
          required:
            - maxImageBytes
            - maxVideoBytes
            - maxDocumentBytes
          properties:
            maxImageBytes:
              type: integer
              format: int64
            maxVideoBytes:
              type: integer
              format: int64
            maxDocumentBytes:
              type: integer
              format: int64
        enforced:
          type: boolean